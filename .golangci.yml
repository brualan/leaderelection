version: "2"

linters:
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - contextcheck
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - gosec
    - govet
    - ineffassign
    - makezero
    - musttag
    - nilerr
    - noctx
    - nosprintfhostport
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unqueryvet
    - unused

  settings:
    errcheck:
      # An election that cannot reach the database is the expected case, so
      # ignoring an error is occasionally correct here -- but only where the
      # code says why.
      check-type-assertions: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
