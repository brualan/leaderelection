name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - name: Vet every module
        run: |
          for m in . ./postgres ./mysql ./tests ./tools; do
            (cd "$m" && go vet ./...)
          done
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      # The action's default working directory is the repository root. Run the
      # same checks for every module, including test and repository tooling.
      - name: Lint every module
        run: make lint

  # The core module is what consumers import, so it is built and tested on the
  # oldest Go it claims to support as well as the newest. Workspace mode is off
  # here on purpose: this is the module as a consumer sees it.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race -timeout 5m ./...
      - run: cd postgres && go test -race -timeout 5m ./...
      - run: cd mysql && go test -race -timeout 5m ./...

  # Every supported PostgreSQL, reached both directly and through PgBouncer.
  # The pooled path is not optional: it is where this library is most likely to
  # break and least likely to notice.
  integration-postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["13", "14", "15", "16", "17"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Start infrastructure
        run: POSTGRES_VERSION=${{ matrix.postgres }} docker compose up -d --wait
      - run: go test -tags=integration -race -timeout 15m ./postgres/...
      - name: Infrastructure logs
        if: failure()
        run: docker compose logs --tail 200
      - run: docker compose down -v

  # And every supported MySQL, direct and through ProxySQL. The upsert this
  # store is built on depends on the server evaluating assignments left to
  # right, so "it worked on the version we developed against" is not a claim
  # worth making without a matrix.
  integration-mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Start infrastructure
        run: MYSQL_VERSION=${{ matrix.mysql }} docker compose up -d --wait
      - run: go test -tags=integration -race -timeout 15m ./mysql/...
      - name: Infrastructure logs
        if: failure()
        run: docker compose logs --tail 200
      - run: docker compose down -v

  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: docker compose up -d --wait
      - run: cd tests && go test -tags=chaos -race -timeout 25m ./...
      - name: Infrastructure logs
        if: failure()
        run: docker compose logs --tail 200
      - run: docker compose down -v

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: docker compose up -d --wait
      # Fails the build below 100% on any production package. The claim is only
      # worth making if something checks it.
      - run: make cover
      - run: docker compose down -v
